<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Приглашение на свадьбу</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&family=Pinyon+Script&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body class="locked">
        <!-- Экран с конвертом -->
        <div id="envelope-overlay">
            <div class="envelope-container">
                <div class="envelope">
                    <div class="letter"></div>
                    <div class="flap"></div>
                    <div class="body"></div>
                    <div class="seal">
                        <span class="heart">♡</span>
                        <span class="text">ОТКРЫТЬ</span>
                    </div>
                </div>
                <p class="tap-text">Нажмите, чтобы открыть</p>
            </div>
        </div>

        <div class="background-overlay"></div>

        <!-- Основной контент -->
        <main class="container">
            <!-- Шапка приглашения -->
            <header class="fade-in">
                <div class="line-title">
                    <span class="line"></span>
                    <span class="text">ПРИГЛАШЕНИЕ</span>
                    <span class="line"></span>
                </div>
                <h1 class="cursive-text">на регистрацию<br />брака</h1>
                <div class="heart-icon">♡</div>
            </header>

            <!-- Вступительный текст -->
            <section class="intro fade-in delay-1">
                <p>
                    Мы будем рады видеть вас<br />в этот особенный для нас день!
                </p>
            </section>

            <!-- Основная информация -->
            <section class="details">
                <div class="detail-item fade-in delay-2">
                    <div class="icon">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                        >
                            <rect
                                x="3"
                                y="4"
                                width="18"
                                height="18"
                                rx="2"
                                ry="2"
                            ></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                            <path
                                d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"
                            ></path>
                        </svg>
                    </div>
                    <div class="text-content">
                        <span class="label">ДАТА</span>
                        <span class="value">16 октября 2026 года</span>
                    </div>
                </div>

                <div class="detail-item fade-in delay-3">
                    <div class="icon">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                        >
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </div>
                    <div class="text-content">
                        <span class="label">ВРЕМЯ</span>
                        <span class="value"
                            >09:30 <span class="small-text">утра</span></span
                        >
                    </div>
                </div>

                <div class="detail-item fade-in delay-4">
                    <div class="icon">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                        >
                            <path
                                d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"
                            ></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                    </div>
                    <div class="text-content">
                        <span class="label">МЕСТО РЕГИСТРАЦИИ</span>
                        <span class="value">ЗАГС, ул. Ленина 98</span>
                    </div>
                </div>

                <div class="notice-item fade-in delay-5">
                    <div class="icon-small">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                        >
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                    </div>
                    <p>Просим прийти за 15 минут<br />до начала церемонии.</p>
                </div>
            </section>

            <!-- Финал -->
            <footer class="fade-in delay-6">
                <div class="line-title">
                    <span class="line"></span>
                    <span class="heart-small">♡</span>
                    <span class="line"></span>
                </div>
                <p class="final-text">БУДЕМ РАДЫ ВАШЕМУ ПРИСУТСТВИЮ!</p>
            </footer>
        </main>

        <script src="script.js"></script>
    </body>
</html>
